map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Telas principais (Account, Orders, Portfolio, Quotes, OfferBook)
server {
    listen 4200;
    root /usr/share/nginx/html/main;
    resolver 127.0.0.11 valid=10s;

    location /api/accounts { set $up tradingsimulator-account:8080;   proxy_pass http://$up; }
    location /api/orders    { set $up tradingsimulator-orders:8080;    proxy_pass http://$up; }
    location /api/assets    { set $up tradingsimulator-portfolio:8080; proxy_pass http://$up; }
    location /api/instruments { set $up tradingsimulator-exchange:8080; proxy_pass http://$up; }

    location /hubs/orders    { set $up tradingsimulator-orders:8080;    include /etc/nginx/hub.conf; }
    location /hubs/portfolio { set $up tradingsimulator-portfolio:8080; include /etc/nginx/hub.conf; }
    location /hubs/quotes    { set $up tradingsimulator-quotes:8080;    include /etc/nginx/hub.conf; }
    location /hubs/offerbook { set $up tradingsimulator-offerbook:8080; include /etc/nginx/hub.conf; }

    location / { try_files $uri $uri/ /index.html; }
}

# Exchange (serviço externo, separado das demais telas)
server {
    listen 4204;
    root /usr/share/nginx/html/exchange;
    resolver 127.0.0.11 valid=10s;

    location /api  { set $up tradingsimulator-exchange:8080; proxy_pass http://$up; }
    location /hubs { set $up tradingsimulator-exchange:8080; include /etc/nginx/hub.conf; }

    location / { try_files $uri $uri/ /index.html; }
}
