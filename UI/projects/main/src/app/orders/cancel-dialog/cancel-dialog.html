<div class="fixed inset-0 z-10 flex items-center justify-center bg-slate-900/50 p-4 cursor-pointer" (click)="closed.emit()">
  <div role="alertdialog" aria-modal="true" aria-labelledby="cancel-title" tabindex="-1"
    class="cursor-default flex w-full max-w-md flex-col gap-4 rounded-lg bg-white p-6 shadow-xl"
    (click)="$event.stopPropagation()">
    <h2 id="cancel-title" class="text-lg font-semibold text-slate-900">Cancelar ordem</h2>
    <p class="text-sm text-slate-700">
      Deseja cancelar a ordem {{ order().ticker }} ({{ order().remainingQuantity }} restantes)?
    </p>
    <p class="text-sm text-red-600" role="alert">{{ errorMessage() }}</p>
    <div class="flex justify-end gap-2">
      <button type="button"
        class="rounded-md border border-slate-300 px-3 py-2 text-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-600"
        (click)="closed.emit()">Voltar</button>
      <button type="button"
        class="rounded-md bg-red-700 px-3 py-2 text-sm font-medium text-white hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-red-600 disabled:opacity-60"
        [disabled]="busy()" (click)="confirm()">{{ busy() ? 'Cancelando…' : 'Cancelar ordem' }}</button>
    </div>
  </div>
</div>
