<main class="min-h-screen bg-[#f6f8f7] text-slate-900">
  <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-10">
    <app-main-menu subtitle="Painel de ordens">
      <span
        class="inline-flex items-center gap-2 rounded-full border px-3 py-1.5 text-xs font-semibold"
        [class.border-emerald-200]="store.connected()"
        [class.bg-emerald-50]="store.connected()"
        [class.text-emerald-800]="store.connected()"
        [class.border-amber-200]="!store.connected()"
        [class.bg-amber-50]="!store.connected()"
        [class.text-amber-800]="!store.connected()"
        role="status"
        aria-live="polite"
      >
        <span class="size-2 rounded-full" [class.bg-emerald-500]="store.connected()" [class.bg-amber-500]="!store.connected()"></span>
        {{ store.connected() ? 'Tempo real conectado' : 'Tempo real desconectado' }}
      </span>
    </app-main-menu>

    <header class="py-8 lg:py-10">
      <p class="mb-2 text-sm font-semibold text-emerald-700">NEGOCIAÇÃO</p>
      <h1 class="text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl">Suas ordens</h1>
      <p class="mt-2 max-w-xl text-sm leading-6 text-slate-600 sm:text-base">
        Envie ordens pela boleta e acompanhe a execução em tempo real.
      </p>
    </header>

    <div class="flex flex-col gap-6">
      <app-order-ticket />
      <app-order-list />
    </div>
  </div>
</main>
