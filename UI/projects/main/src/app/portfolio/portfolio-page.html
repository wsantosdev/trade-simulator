<div class="min-h-screen bg-[#f6f8f7] text-slate-900">
  <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-10">
    <app-main-menu subtitle="Carteira de ativos">
      <p
        role="status"
        aria-live="polite"
        class="inline-flex items-center gap-2 rounded-full border px-3 py-1.5 text-xs font-semibold"
        [class]="store.connected() ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-amber-200 bg-amber-50 text-amber-800'"
      >
        <span class="size-2 rounded-full" [class]="store.connected() ? 'bg-emerald-500' : 'bg-amber-500'"></span>
        {{ store.connected() ? 'Tempo real conectado' : 'Tempo real desconectado' }}
      </p>
    </app-main-menu>

    <header class="py-8 lg:py-10">
      <p class="mb-2 text-sm font-semibold uppercase text-emerald-700">Portfólio</p>
      <h1 class="text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl">Suas posições</h1>
      <p class="mt-2 max-w-xl text-sm leading-6 text-slate-600 sm:text-base">Acompanhe em tempo real os ativos da sua carteira, disponíveis e bloqueados.</p>
    </header>

    <main class="flex flex-col gap-6">
      <app-asset-list />
    </main>
  </div>
</div>
