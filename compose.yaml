services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tradesimulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradesimulator"]
      interval: 5s
      timeout: 5s
      retries: 10

  tradesimulator-account:
    image: tradesimulator-account
    build:
      context: .
      dockerfile: Account/TradeSimulator.Account/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Accounts: Host=postgres;Port=5432;Database=tradesimulator;Username=tradesimulator;Password=tradesimulator-local;Search Path=account
    stop_grace_period: 40s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  tradesimulator-orders:
    image: tradesimulator-orders
    build:
      context: .
      dockerfile: Orders/TradeSimulator.Orders/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Simulation__SessionClockOffset: ${EXCHANGE_SESSION_CLOCK_OFFSET:-00:00:00}
      Services__Account__BaseUrl: http://tradesimulator-account:8080
      Services__Portfolio__BaseUrl: http://tradesimulator-portfolio:8080
      OfferBook__BaseUrl: http://tradesimulator-offerbook:8080
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=tradesimulator;Username=tradesimulator;Password=tradesimulator-local;Search Path=orders
      ConnectionStrings__Mongo: mongodb://mongo:27017
      Mongo__Database: orders
      RabbitMq__Uri: amqp://account:account-local@rabbitmq:5672/
    stop_grace_period: 40s
    ports:
      - "8081:8080"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  tradesimulator-exchange:
    image: tradesimulator-exchange
    build:
      context: .
      dockerfile: Exchange/TradeSimulator.Exchange/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Simulation__SessionClockOffset: ${EXCHANGE_SESSION_CLOCK_OFFSET:-00:00:00}
      Seed__Directory: /seed
      ConnectionStrings__Exchange: Host=postgres;Port=5432;Database=tradesimulator;Username=tradesimulator;Password=tradesimulator-local;Search Path=exchange
      RabbitMq__Uri: amqp://account:account-local@rabbitmq:5672/
    stop_grace_period: 40s
    volumes:
      - ${EXCHANGE_SEED_DIR:-./data/b3}:/seed:ro
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  tradesimulator-quotes:
    image: tradesimulator-quotes
    build:
      context: .
      dockerfile: Quotes/TradeSimulator.Quotes/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Uri: amqp://account:account-local@rabbitmq:5672/
    ports:
      - "8084:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  tradesimulator-offerbook:
    image: tradesimulator-offerbook
    build:
      context: .
      dockerfile: OfferBook/TradeSimulator.OfferBook/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Uri: amqp://account:account-local@rabbitmq:5672/
    ports:
      - "8085:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  tradesimulator-portfolio:
    image: tradesimulator-portfolio
    build:
      context: .
      dockerfile: Portfolio/TradeSimulator.Portfolio/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Portfolio: Host=postgres;Port=5432;Database=tradesimulator;Username=tradesimulator;Password=tradesimulator-local;Search Path=portfolio
      ConnectionStrings__Mongo: mongodb://mongo:27017
      Mongo__Database: portfolio
      RabbitMq__Uri: amqp://account:account-local@rabbitmq:5672/
    stop_grace_period: 40s
    ports:
      - "8082:8080"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: account
      RABBITMQ_DEFAULT_PASS: account-local
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    image: tradesimulator-ui
    build:
      context: UI
    ports:
      - "4200:4200"
      - "4201:4201"
      - "4204:4204"
    depends_on:
      - tradesimulator-account
      - tradesimulator-orders
      - tradesimulator-exchange
      - tradesimulator-quotes
      - tradesimulator-offerbook
      - tradesimulator-portfolio

volumes:
  postgres-data:
  mongo-data:
